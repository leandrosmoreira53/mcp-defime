[project]
name = "mcp-defime"
version = "0.1.0"
description = "MCP server for tokenized-asset (RWA) liquidity pools on Robinhood Chain: DexScreener, GeckoTerminal and on-chain reads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9,<2",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "uvicorn>=0.29",
  "pycryptodome>=3.19",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
mcp-defime = "defime_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defime_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: chama as APIs reais (rodar manualmente: pytest -m live)"]
addopts = "-m 'not live'"
pythonpath = ["src"]
